services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${API_DATABASE_URL:?Set API_DATABASE_URL to the postgres service URL}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      PORT: ${PORT:-3000}
      NEWS_CORS_ORIGINS: ${NEWS_CORS_ORIGINS:-}
      NEWS_INTERNAL_TOKEN: ${NEWS_INTERNAL_TOKEN:-}
      JOBS_INTERNAL_TOKEN: ${JOBS_INTERNAL_TOKEN:?Set JOBS_INTERNAL_TOKEN in the root .env}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    command: ["sh", "-c", "nub run db:migrate && nub --cwd apps/api run start"]
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  bot:
    profiles: ["bot"]
    build:
      context: .
      target: bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_OWNER_CLIENT_ID: ${DISCORD_OWNER_CLIENT_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DATABASE_URL: ${API_DATABASE_URL:?Set API_DATABASE_URL to the postgres service URL}
      NEWS_API_URL: http://api:${PORT:-3000}
      YOUTUBE_API_URL: ${YOUTUBE_API_URL:-}
      NEWS_INTERNAL_TOKEN: ${NEWS_INTERNAL_TOKEN:-}
      JOBS_INTERNAL_TOKEN: ${JOBS_INTERNAL_TOKEN:?Set JOBS_INTERNAL_TOKEN in the root .env}
      BOT_HEALTH_PORT: "3001"
      BOT_HEALTH_HOST: "0.0.0.0"
    volumes:
      - bot_data:/app/apps/bot/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

  jobs:
    profiles: ["bot"]
    build:
      context: .
      target: jobs
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      NEWS_API_URL: http://api:${PORT:-3000}
      YOUTUBE_API_URL: ${YOUTUBE_API_URL:-}
      BOT_URL: http://bot:3001
      JOBS_INTERNAL_TOKEN: ${JOBS_INTERNAL_TOKEN:?Set JOBS_INTERNAL_TOKEN in the root .env}
      JOBS_DASHBOARD_PORT: "3002"
      JOBS_DASHBOARD_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      api:
        condition: service_healthy
      bot:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  bot_data:
  redis_data:
