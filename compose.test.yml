services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration-only-password
      POSTGRES_DB: integration
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d integration"]
      interval: 2s
      timeout: 2s
      retries: 20
